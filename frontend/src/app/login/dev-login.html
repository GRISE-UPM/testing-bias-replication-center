<section class="box">
  <p class="warn" role="note">
    Temporary development login. Real sign-in with Google through Amazon Cognito will replace it.
  </p>
  <h1>Log in</h1>
  <form (submit)="$event.preventDefault(); submit(email.value, role.value)">
    <label>Email <input #email type="email" name="email" autocomplete="off" /></label>
    <label>
      Role
      <select #role name="role">
        @for (r of roles; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </label>
    <button type="submit">Log in</button>
  </form>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</section>
