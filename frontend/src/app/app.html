<header class="site-header">
  <a class="brand" routerLink="/">Replication Center</a>
  <nav>
    @if (auth.user(); as u) {
      <a routerLink="/experiment">Experiment</a>
      @if (u.role === 'interested') { <a routerLink="/join">Join the project</a> }
      @if (u.role === 'organizer') { <a routerLink="/requests">Requests</a> }
      <span class="who">{{ u.email }} ({{ u.role }})</span>
      <button type="button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Log in</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>
